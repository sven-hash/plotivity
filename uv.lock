# Garmin Connect (default mode). If you have MFA, you'll be asked for the code on first run.
GARMIN_EMAIL=
GARMIN_PASSWORD=

# --- Strava API (only for --strava) -----------------------------------------
# Note: Strava requires a paid subscription on the app owner's account for API access.
# Option A: paste a short-lived access token (expires after ~6h)
# STRAVA_ACCESS_TOKEN=
# Option B: auto-refresh. Get these from https://www.strava.com/settings/api
# after doing the one-time OAuth flow with scope activity:read_all (see README.md)
STRAVA_CLIENT_ID=
STRAVA_CLIENT_SECRET=
STRAVA_REFRESH_TOKEN=
