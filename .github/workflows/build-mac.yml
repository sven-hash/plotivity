name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple Silicon (arm64)
            arch: arm64
          - os: macos-15-intel    # Intel (x86_64); last Intel image GitHub offers, until Aug 2027
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build app + DMG
        run: ./packaging/build_mac.sh ${{ matrix.arch }}
      - name: Smoke test (app starts and stays up)
        run: |
          "dist/${{ matrix.arch }}/Run Map.app/Contents/MacOS/Run Map" > app.log 2>&1 &
          PID=$!
          sleep 8
          if kill -0 "$PID" 2>/dev/null; then kill "$PID"; echo "started ok"; else cat app.log; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: RunMap-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  release:
    # Tag a commit `v0.2.0` and push it -> GitHub Release with both DMGs attached
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --repo "$GITHUB_REPOSITORY" --title "Run Map $GITHUB_REF_NAME" --generate-notes
